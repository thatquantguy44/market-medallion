name: Python and warehouse contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: aaii_test
          POSTGRES_USER: aaii_test
          # Public, disposable localhost test credential; never production configuration.
          POSTGRES_PASSWORD: ci_disposable_test_only
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U aaii_test -d aaii_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/verify_agent_skills.py
      - run: ruff check .
      - run: ruff format --check .
      - name: Configure isolated FOMC PostgreSQL checks
        run: |
          python - <<'PYCONFIG'
          from pathlib import Path
          import yaml
          path = Path("config/fomc_meeting_minutes/pipeline.example.yml")
          cfg = yaml.safe_load(path.read_text())
          cfg["postgres"].update(port=55439, database="aaii_test", user="aaii_test")
          Path("config/fomc_meeting_minutes/pipeline.ci.local.yml").write_text(
              yaml.safe_dump(cfg)
          )
          PYCONFIG
      - run: python -m pytest -q
        env:
          MARKET_DATA_TEST_POSTGRES_DSN: postgresql://aaii_test:ci_disposable_test_only@127.0.0.1:55439/aaii_test
          FOMC_TEST_POSTGRES_CONFIG: config/fomc_meeting_minutes/pipeline.ci.local.yml
          # Same public, disposable service credential as above; no external service access.
          FOMC_POSTGRES_PASSWORD: ci_disposable_test_only
      - run: python -m build --no-isolation

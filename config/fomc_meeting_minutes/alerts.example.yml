# Optional: copy to alerts.local.yml, supply the secret in the daemon environment,
# enable Slack below and start fomc_meeting_minutes_slack_failure in Dagster.
slack:
  enabled: false
  webhook_url_env: FOMC_MEETING_MINUTES_SLACK_WEBHOOK_URL
  dagster_url: http://127.0.0.1:3030
network:
  mode: auto
  preferred_route: proxy
  fallback: true
  probe_timeout_seconds: 5
  timeout_seconds: 10

## AAII Pipeline configuration file for PostgreSQL database
warehouse: postgres
network:
  mode: auto
  preferred_route: proxy
  fallback: true
  proxy_url_env: null
  no_proxy: [localhost, 127.0.0.1]
  use_environment_no_proxy: true
  probe_timeout_seconds: 10
  timeout_seconds: 30
  ca_bundle: null
root: ../data/aaii-postgres
postgres:
  host: 127.0.0.1
  port: 55432
  database: additional_market_data
  user: market_data
  role: null
  schema: public
  password_env: AAII_POSTGRES_PASSWORD
  sslmode: prefer
  connect_timeout: 15
operations:
  overlap_days: 28
  max_age_days: 10
  http_attempts: 3
  # Set true only after verifying your permission for recurring acquisition.
  # Dagster's live schedule also remains STOPPED until explicitly enabled.
  scheduled_live_access: false

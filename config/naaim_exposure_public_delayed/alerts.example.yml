# Optional: copy to alerts.local.yml, supply the secret in the daemon environment,
# enable Slack below and start naaim_exposure_public_delayed_slack_failure in Dagster.
slack:
  enabled: false
  on_failure: true
  on_success: false
  webhook_url_env: NAAIM_EXPOSURE_PUBLIC_DELAYED_SLACK_WEBHOOK_URL
  dagster_url: http://127.0.0.1:3030
network:
  mode: auto
  preferred_route: proxy
  fallback: true
  probe_timeout_seconds: 5
  timeout_seconds: 10
